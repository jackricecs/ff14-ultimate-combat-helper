name: Bug 反馈
description: 插件报错、提醒不对、加载失败
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: 插件版本, placeholder: "v0.2.0-cn" }
    validations: { required: true }
  - type: dropdown
    id: server
    attributes: { label: 服务器, options: [国服, 国际服] }
    validations: { required: true }
  - type: input
    id: parser
    attributes: { label: 解析插件版本, placeholder: "FFXIV_ACT_Plugin_CN 26.6.9.0" }
  - type: textarea
    id: what
    attributes: { label: 发生了什么 / 期望是什么, description: 职业、副本、当时的操作 }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: 「总览」页日志或相关日志行, render: text }
